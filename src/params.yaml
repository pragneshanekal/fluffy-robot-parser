extract:
  basic_patterns:
    font_size_threshold: 12
    header_keywords: ["APPLE INC", "FORM 10-K", "PART", "ITEM"]
    footer_keywords: ["Apple Inc.", "2024 Form 10-K"]
  
  table_settings:
    min_rows: 2
    min_cols: 2
    confidence_threshold: 0.7

classification:
  section_patterns:
    business_description: ["item 1.", "business"]
    risk_factors: ["risk factor", "item 1a"]
    financial_statements: ["consolidated statements", "balance sheet", "income statement", "cash flows", "shareholders equity", "comprehensive income"]
    notes_to_statements: ["notes to consolidated financial statements", "note \\d+"]
    exhibits: ["exhibit"]
  
  exhibit_patterns:
    exhibit_regex: "exhibit\\s+(\\d+\\.\\d+|\\d+[a-z]?)"

extraction:
  metric_patterns:
    currency: "\\$\\s*[\\d,]+(?:\\.\\d+)?(?:\\s*million)?(?:\\s*billion)?"
    percentage: "[\\d,]+\\.\\d+%"
    shares: "[\\d,]+(?:\\s*shares?)?(?:\\s*outstanding)?"